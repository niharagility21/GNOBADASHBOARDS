name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'dashboards/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Configure Nginx for public access
        run: |
          echo "Configuring Nginx..."
          sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 bash <<'ENDSSH'

          # Create directory
          mkdir -p /var/www/html/generated
          chmod -R 755 /var/www/html

          # Configure Nginx for public access (no password)
          cat > /etc/nginx/sites-available/default <<'EOF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              root /var/www/html;
              index index.html;

              server_name _;

              location / {
                  try_files $uri $uri/ =404;
              }

              location /generated/ {
                  # Public access - no authentication
                  autoindex off;
                  try_files $uri $uri/ =404;
              }
          }
          EOF

          # Test and reload Nginx
          nginx -t && systemctl reload nginx
          echo "Nginx configured for public access"
          ENDSSH

      - name: Deploy files
        run: |
          echo "Deploying files..."
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              if [[ "$filename" == *"done"* ]]; then
                echo "Skip: $filename"
                continue
              fi

              echo "Upload: $filename"
              sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" root@139.59.64.19:/var/www/html/generated/

              name="${filename%.html}"
              sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
                "cd /var/www/html/generated && mv '$filename' '${name}done.html' && chmod 644 '${name}done.html'"

              echo "✅ ${name}done.html"
            fi
          done

      - name: Get all URLs
        id: urls
        run: |
          echo "Collecting URLs..."
          URLS=""
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" != *"done"* ]]; then
                name="${filename%.html}"
                URL="http://139.59.64.19/generated/${name}done.html"
                URLS="${URLS}${URL}"$'\n'
                echo "URL: $URL"
              fi
            fi
          done

          {
            echo "urls<<URLEOF"
            echo "$URLS"
            echo "URLEOF"
          } >> $GITHUB_OUTPUT

      - name: Send email with SendGrid API
        if: success()
        env:
          EMAIL_URLS: ${{ steps.urls.outputs.urls }}
        run: |
          # Use curl to send email via Gmail SMTP
          URLS="${EMAIL_URLS}"

          # Create email body
          cat > /tmp/email.txt <<EMAILEOF
          From: GNO Dashboards <agilitytechai@gmail.com>
          To: iampreetdave@gmail.com, anshthakkar4904@gmail.com
          Subject: Dashboard Deployed Successfully

          Dashboard deployment completed!

          Live URLs (no password required):
          ${URLS}

          Server: http://139.59.64.19
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          All dashboards are now publicly accessible!
          EMAILEOF

          # Send to first recipient
          curl -v --url 'smtps://smtp.gmail.com:465' \
            --ssl-reqd \
            --mail-from 'agilitytechai@gmail.com' \
            --mail-rcpt 'iampreetdave@gmail.com' \
            --upload-file /tmp/email.txt \
            --user 'agilitytechai@gmail.com:wfkp ggxu vyvg donh' \
            --insecure || echo "First email may have failed"

          # Send to second recipient
          curl -v --url 'smtps://smtp.gmail.com:465' \
            --ssl-reqd \
            --mail-from 'agilitytechai@gmail.com' \
            --mail-rcpt 'anshthakkar4904@gmail.com' \
            --upload-file /tmp/email.txt \
            --user 'agilitytechai@gmail.com:wfkp ggxu vyvg donh' \
            --insecure || echo "Second email may have failed"

          echo "Email sending attempted"

      - name: Summary
        run: |
          echo "============================================"
          echo "Deployment Complete!"
          echo "============================================"
          echo ""
          echo "Live URLs (Public Access - No Password):"
          echo "${{ steps.urls.outputs.urls }}"
          echo ""
          echo "============================================"
