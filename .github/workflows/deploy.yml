name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'dashboards/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Setup server
        run: |
          sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
            "mkdir -p /var/www/html/generated && chmod -R 755 /var/www/html"

      - name: Deploy files
        run: |
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              if [[ "$filename" == *"done"* ]]; then
                echo "Skip: $filename"
                continue
              fi

              echo "Upload: $filename"
              sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" root@139.59.64.19:/var/www/html/generated/

              name="${filename%.html}"
              sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
                "cd /var/www/html/generated && mv '$filename' '${name}done.html' && chmod 644 '${name}done.html'"

              echo "Done: ${name}done.html"
            fi
          done

      - name: Get URLs
        id: urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" != *"done"* ]]; then
                name="${filename%.html}"
                URLS="${URLS}http://139.59.64.19/generated/${name}done.html"$'\n'
              fi
            fi
          done
          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email
        if: success()
        continue-on-error: true
        run: |
          python3 <<'PYEOF'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          sender = "agilitytechai@gmail.com"
          password = "wfkp ggxu vyvg donh"
          recipients = ["iampreetdave@gmail.com", "anshthakkar4904@gmail.com"]

          urls = """${{ steps.urls.outputs.urls }}"""

          msg = MIMEMultipart()
          msg['From'] = f"GNO Dashboards <{sender}>"
          msg['To'] = ", ".join(recipients)
          msg['Subject'] = "Dashboard Deployed"

          body = f"""Deployment successful!

          Live URLs:
          {urls}

          Server: http://139.59.64.19
          Commit: ${{ github.sha }}"""

          msg.attach(MIMEText(body, 'plain'))

          try:
              s = smtplib.SMTP('smtp.gmail.com', 587)
              s.starttls()
              s.login(sender, password)
              s.send_message(msg)
              s.quit()
              print("Email sent")
          except Exception as e:
              print(f"Email failed: {e}")
          PYEOF

      - name: Done
        run: |
          echo "Deployment complete"
          echo "${{ steps.urls.outputs.urls }}"
