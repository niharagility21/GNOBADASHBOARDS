name: Deploy Dashboards

on:
  push:
    branches:
      - main
    paths:
      - 'dashboards/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy dashboards to server
        run: |
          # Get list of HTML files to deploy
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Deploying $filename..."

              # Deploy to server
              sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" root@139.59.64.19:/root/gnopartners/generated/

              # Rename file on server by adding 'done' suffix
              name="${filename%.html}"
              sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
                "cd /root/gnopartners/generated && mv '$filename' '${name}done.html'"

              echo "✅ Deployed and renamed: ${name}done.html"
            fi
          done

      - name: Get live URLs
        id: get-urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              name="${filename%.html}"
              URLS="${URLS}http://139.59.64.19/generated/${name}done.html\n"
            fi
          done
          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo -e "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: agilitytechai@gmail.com
          password: "wfkp ggxu vyvg donh"
          subject: "✅ Dashboard Deployed Successfully"
          to: iampreetdave@gmail.com,anshthakkar4904@gmail.com
          from: GNO BA Dashboards <agilitytechai@gmail.com>
          body: |
            Dashboard deployment completed successfully!

            🔗 Live Website URLs:
            ${{ steps.get-urls.outputs.urls }}

            📊 Deployment Details:
            - Server: http://139.59.64.19
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Time: ${{ github.event.head_commit.timestamp }}

            ✅ All dashboards are now live!

            ---
            GitHub Actions - GNO BA Dashboards

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: agilitytechai@gmail.com
          password: "wfkp ggxu vyvg donh"
          subject: "❌ Dashboard Deployment Failed"
          to: iampreetdave@gmail.com,anshthakkar4904@gmail.com
          from: GNO BA Dashboards <agilitytechai@gmail.com>
          body: |
            Dashboard deployment failed!

            ❌ Deployment Details:
            - Server: 139.59.64.19
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}

            🔍 Check the workflow run for details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            GitHub Actions - GNO BA Dashboards
