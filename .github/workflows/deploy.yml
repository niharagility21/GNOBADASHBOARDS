name: Deploy

on:
  push:
    branches: [main]
    paths: ['dashboards/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Deploy to server
        run: |
          # Deploy each HTML file
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # Skip files already processed
            [[ "$filename" == *"done"* ]] && continue

            echo "Deploying: $filename"

            # Upload file
            sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" \
              root@139.59.64.19:/var/www/html/generated/

            # Rename with done suffix
            name="${filename%.html}"
            sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
              "cd /var/www/html/generated && mv '$filename' '${name}done.html' && chmod 644 '${name}done.html'"

            echo "✅ Deployed: ${name}done.html"
          done

      - name: Collect URLs
        id: urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            [[ "$filename" == *"done"* ]] && continue

            name="${filename%.html}"
            URLS="${URLS}http://139.59.64.19/generated/${name}done.html"$'\n'
          done

          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "All URLs:"
          echo "$URLS"

      - name: Send emails to all recipients
        run: |
          URLS="${{ steps.urls.outputs.urls }}"

          # Create email message
          cat > /tmp/email.txt <<'EMAILEND'
          From: GNO Dashboards <agilitytechai@gmail.com>
          Subject: Dashboard Deployed Successfully

          Dashboard deployment completed!

          Live URLs (publicly accessible):
          EMAILEND

          echo "$URLS" >> /tmp/email.txt

          cat >> /tmp/email.txt <<'EMAILEND'

          Server: http://139.59.64.19
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          All dashboards are now live and publicly accessible!
          EMAILEND

          # Send to all recipients
          RECIPIENTS=(
            "iampreetdave@gmail.com"
            "anshthakkar4904@gmail.com"
            "nihar.thakkar@agilitytech.ai"
          )

          for recipient in "${RECIPIENTS[@]}"; do
            echo "Sending email to: $recipient"

            curl -v --url 'smtps://smtp.gmail.com:465' \
              --ssl-reqd \
              --mail-from 'agilitytechai@gmail.com' \
              --mail-rcpt "$recipient" \
              --user 'agilitytechai@gmail.com:wfkp ggxu vyvg donh' \
              --upload-file /tmp/email.txt \
              --insecure 2>&1 | tail -20

            echo "✅ Email sent to: $recipient"
            echo "---"
          done

      - name: Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo ""
          echo "Public URLs (no password required):"
          echo "${{ steps.urls.outputs.urls }}"
          echo ""
          echo "Emails sent to:"
          echo "  - iampreetdave@gmail.com"
          echo "  - anshthakkar4904@gmail.com"
          echo "  - nihar.thakkar@agilitytech.ai"
          echo ""
          echo "=========================================="
