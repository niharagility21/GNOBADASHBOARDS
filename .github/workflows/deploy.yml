name: Deploy Dashboards

on:
  push:
    branches:
      - main
    paths:
      - 'dashboards/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Setup server
        run: |
          echo "Setting up server directories..."
          sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@139.59.64.19 \
            "mkdir -p /var/www/html/generated && chmod -R 755 /var/www/html"
          echo "✅ Server ready"

      - name: Deploy dashboards
        run: |
          echo "Deploying HTML files..."
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")

              # Skip files with 'done' suffix
              if [[ "$filename" == *"done"* ]]; then
                echo "⏭️  Skipping $filename (already processed)"
                continue
              fi

              echo "📤 Uploading $filename..."

              # Upload file
              sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$file" root@139.59.64.19:/var/www/html/generated/

              # Rename with 'done' suffix
              name="${filename%.html}"
              sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 root@139.59.64.19 \
                "cd /var/www/html/generated && mv '$filename' '${name}done.html' && chmod 644 '${name}done.html'"

              echo "✅ Deployed: ${name}done.html"
            fi
          done

      - name: Get URLs
        id: urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              if [[ "$filename" != *"done"* ]]; then
                name="${filename%.html}"
                URLS="${URLS}http://139.59.64.19/generated/${name}done.html"$'\n'
              fi
            fi
          done
          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email
        if: success()
        continue-on-error: true
        run: |
          python3 << 'ENDPYTHON'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          sender = "agilitytechai@gmail.com"
          password = "wfkp ggxu vyvg donh"
          recipients = ["iampreetdave@gmail.com", "anshthakkar4904@gmail.com"]

          urls = """${{ steps.urls.outputs.urls }}"""

          msg = MIMEMultipart()
          msg['From'] = f"GNO Dashboards <{sender}>"
          msg['To'] = ", ".join(recipients)
          msg['Subject'] = "✅ Dashboard Deployed"

          body = f"""Dashboard deployment successful!

🔗 Live URLs:
{urls}

Server: http://139.59.64.19
Commit: ${{ github.sha }}
Branch: ${{ github.ref_name }}

All dashboards are now live!"""

          msg.attach(MIMEText(body, 'plain'))

          try:
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              server.login(sender, password)
              server.send_message(msg)
              server.quit()
              print("✅ Email sent!")
          except Exception as e:
              print(f"⚠️  Email error: {e}")
          ENDPYTHON

      - name: Complete
        run: |
          echo "✅ Deployment complete!"
          echo ""
          echo "🔗 Live URLs:"
          echo "${{ steps.urls.outputs.urls }}"
