name: Deploy

on:
  push:
    branches: [main]
    paths: ['dashboards/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Deploy NEW files only
        run: |
          # Deploy only NEW files (without -posted suffix)
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # Skip files already posted
            if [[ "$filename" == *"-posted"* ]]; then
              echo "⏭️  Skip: $filename (already posted)"
              continue
            fi

            echo "📤 Deploying: $filename"

            # Upload file
            sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" \
              root@139.59.64.19:/var/www/html/generated/

            # Rename with -posted suffix on server
            name="${filename%.html}"
            sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
              "cd /var/www/html/generated && mv '$filename' '${name}-posted.html' && chmod 644 '${name}-posted.html'"

            echo "✅ Deployed: ${name}-posted.html"
          done

      - name: Collect NEW URLs
        id: urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # Only show URLs for files that were just deployed (no -posted suffix yet)
            if [[ "$filename" != *"-posted"* ]]; then
              name="${filename%.html}"
              URLS="${URLS}http://139.59.64.19/generated/${name}-posted.html"$'\n'
            fi
          done

          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "New URLs:"
          echo "$URLS"

      - name: Send emails
        run: |
          URLS="${{ steps.urls.outputs.urls }}"

          # Skip if no new files
          if [ -z "$URLS" ]; then
            echo "No new files deployed, skipping email"
            exit 0
          fi

          # Send email using Python
          python3 << 'PYEND'
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          # Email config
          sender = "agilitytechai@gmail.com"
          password = "djjj kkhw mieu qisz"
          recipients = [
              "iampreetdave@gmail.com",
              "anshthakkar4904@gmail.com",
              "nihar.thakkar@agilitytech.ai"
          ]

          urls = """${{ steps.urls.outputs.urls }}"""

          # Create email
          msg = MIMEMultipart()
          msg['From'] = f"GNO Dashboards <{sender}>"
          msg['To'] = ", ".join(recipients)
          msg['Subject'] = "New Dashboard Deployed"

          body = f"""New dashboard deployed successfully!

          Live URLs (publicly accessible):
          {urls}

          Server: http://139.59.64.19
          Commit: ${{ github.sha }}

          All dashboards are publicly accessible!"""

          msg.attach(MIMEText(body, 'plain'))

          # Send email
          try:
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              server.login(sender, password)
              server.send_message(msg)
              server.quit()
              print("✅ Emails sent successfully to all recipients!")
          except Exception as e:
              print(f"❌ Email failed: {e}")
          PYEND

      - name: Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo ""
          echo "New URLs (no password required):"
          echo "${{ steps.urls.outputs.urls }}"
          echo ""
          echo "Emails sent to:"
          echo "  - iampreetdave@gmail.com"
          echo "  - anshthakkar4904@gmail.com"
          echo "  - nihar.thakkar@agilitytech.ai"
          echo ""
          echo "=========================================="
