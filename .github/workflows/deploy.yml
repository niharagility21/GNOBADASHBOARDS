name: Deploy

on:
  push:
    branches: [main]
    paths: ['dashboards/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Deploy to server
        run: |
          # Deploy each HTML file
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # Skip files already processed
            [[ "$filename" == *"done"* ]] && continue

            echo "Deploying: $filename"

            # Upload file
            sshpass -p 'TN@qwe4321n' scp -o StrictHostKeyChecking=no "$file" \
              root@139.59.64.19:/var/www/html/generated/

            # Rename with done suffix
            name="${filename%.html}"
            sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 \
              "cd /var/www/html/generated && mv '$filename' '${name}done.html'"

            echo "✅ Deployed: ${name}done.html"
          done

      - name: Configure server (first time only)
        run: |
          sshpass -p 'TN@qwe4321n' ssh -o StrictHostKeyChecking=no root@139.59.64.19 'bash -s' <<'SCRIPT'
          # Create directory
          mkdir -p /var/www/html/generated
          chmod -R 755 /var/www/html

          # Remove any password protection
          if [ -f /etc/nginx/.htpasswd ]; then
            rm /etc/nginx/.htpasswd
          fi

          # Simple Nginx config - public access
          cat > /etc/nginx/sites-available/default <<'EOF'
          server {
              listen 80 default_server;
              root /var/www/html;
              index index.html;
              server_name _;

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          EOF

          nginx -t && systemctl reload nginx
          echo "Server configured for public access"
          SCRIPT

      - name: Collect URLs
        id: urls
        run: |
          URLS=""
          for file in dashboards/*.html; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            [[ "$filename" == *"done"* ]] && continue

            name="${filename%.html}"
            URLS="${URLS}http://139.59.64.19/generated/${name}done.html"$'\n'
          done

          echo "urls<<EOF" >> $GITHUB_OUTPUT
          echo "$URLS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "All URLs:"
          echo "$URLS"

      - name: Send emails
        run: |
          URLS="${{ steps.urls.outputs.urls }}"

          # Email content
          cat > /tmp/email.txt <<EOF
          From: GNO Dashboards <agilitytechai@gmail.com>
          To: iampreetdave@gmail.com
          Subject: Dashboard Deployed

          Dashboard deployment successful!

          Live URLs:
          $URLS

          Server: http://139.59.64.19
          Commit: ${{ github.sha }}

          All dashboards are publicly accessible!
          EOF

          # Send to each recipient
          for email in iampreetdave@gmail.com anshthakkar4904@gmail.com ansh.t@agilitytech.ai; do
            curl --url 'smtps://smtp.gmail.com:465' \
              --ssl-reqd \
              --mail-from 'agilitytechai@gmail.com' \
              --mail-rcpt "$email" \
              --user 'agilitytechai@gmail.com:wfkp ggxu vyvg donh' \
              --upload-file /tmp/email.txt \
              --insecure 2>&1 | grep -E "(OK|250|sent)" || true
            echo "Email sent to $email"
          done

      - name: Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo ""
          echo "Public URLs (no password required):"
          echo "${{ steps.urls.outputs.urls }}"
          echo ""
          echo "=========================================="
